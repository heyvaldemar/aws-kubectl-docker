name: Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild: reinstalls the added packages from the current Ubuntu
    # archive and fetches current kubectl and AWS CLI. The pinned base digest
    # moves only by pull request.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: heyvaldemar/aws-kubectl

jobs:
  lint:
    name: Lint Dockerfile and shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: ShellCheck
        run: |
          shellcheck --version
          shopt -s nullglob globstar
          shellcheck scripts/**/*.sh

  versions:
    name: Resolve the kubectl lines to build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      lines: ${{ steps.lines.outputs.lines }}
    steps:
      # THE THREE NEWEST KUBERNETES MINORS, the window upstream supports. Each
      # gets a moving tag, kube-<minor>, rebuilt with this image every week, so
      # a pipeline can follow its cluster's minor and still receive security
      # rebuilds; latest keeps following the newest minor. kubectl is supported
      # within one minor of the API server, so a cluster on 1.35 is not served
      # well by a latest that jumped to 1.37.
      - name: The newest three minors and their current patch releases
        id: lines
        run: |
          set -euo pipefail
          newest="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          minor="${newest#v}"; minor="${minor%.*}"
          major="${minor%%.*}"; m="${minor#*.}"
          lines='[]'
          for i in 0 1 2; do
            line="${major}.$((m - i))"
            version="$(curl -fsSL "https://dl.k8s.io/release/stable-${line}.txt")"
            case "$version" in v"${line}".*) ;; *) echo "::error::stable-${line}.txt answered '${version}'"; exit 1 ;; esac
            lines="$(jq -c --arg minor "$line" --arg version "$version" --argjson newest "$([ "$i" = 0 ] && echo true || echo false)" \
              '. + [{minor: $minor, version: $version, newest: $newest}]' <<<"$lines")"
          done
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "$lines" | jq .

  test:
    name: Test kubectl ${{ matrix.line.minor }} before it is published
    runs-on: ubuntu-latest
    needs: [lint, versions]
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(needs.versions.outputs.lines) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image for this runner
        env:
          KUBE_VERSION: ${{ matrix.line.version }}
        run: docker build --build-arg "KUBE_VERSION=${KUBE_VERSION}" -t aws-kubectl:local .

      # Every advertised tool answers, the baked-in kubectl version matches
      # the binary, and the image runs as UID 10001 with a writable HOME.
      - name: Smoke test
        run: ./scripts/smoke-test.sh aws-kubectl:local

      # A test that cannot fail is not a test: each promise is broken in a
      # copy of the Dockerfile, the image rebuilt, and the run fails if the
      # smoke test stays green.
      # The published image is the baseline: every executable on its PATH,
      # its user, HOME, working directory, entrypoint and command, the AWS CLI
      # major, and kubectl no older (and on its own minor, for kube-<minor>).
      # A build that breaks any of it is not published.
      - name: The contract with what is already published
        env:
          NEWEST: ${{ matrix.line.newest }}
          MINOR: ${{ matrix.line.minor }}
        run: |
          if [ "$NEWEST" = true ]; then
            ./scripts/contract-test.sh aws-kubectl:local heyvaldemar/aws-kubectl:latest
          else
            ./scripts/contract-test.sh aws-kubectl:local "heyvaldemar/aws-kubectl:kube-${MINOR}" "$MINOR"
          fi

      - name: The smoke and contract tests, shown each violation they exist for
        if: matrix.line.newest
        run: python3 tests/plant-violations.py -- bash -c 'docker build -q -t aws-kubectl:plant . >/dev/null && ./scripts/smoke-test.sh aws-kubectl:plant >/dev/null 2>&1 && ./scripts/contract-test.sh aws-kubectl:plant heyvaldemar/aws-kubectl:latest'

      # The AWS CLI team's key expires 2027-07-01. Thirty days before, this
      # goes red, so the refresh is a pull request and not a broken build.
      - name: The AWS CLI signing key is not about to expire
        run: |
          set -euo pipefail
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME
          gpg --batch --quiet --import aws-cli-public-key.asc
          expires="$(gpg --batch --with-colons --list-keys FB5DB77FD5C118B80511ADA8A6310ACC4672475C | awk -F: '/^pub/{print $7; exit}')"
          left=$(( (expires - $(date +%s)) / 86400 ))
          echo "the AWS CLI signing key expires in ${left} days"
          if [ "$left" -lt 30 ]; then
            echo "::error::the AWS CLI signing key expires in ${left} days: refresh aws-cli-public-key.asc from the AWS CLI install guide"
            exit 1
          fi

  build:
    name: Build and publish kubectl ${{ matrix.line.minor }}
    runs-on: ubuntu-latest
    # Nothing is published that the test has not passed.
    needs: [lint, versions, test]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(needs.versions.outputs.lines) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The kubectl this line builds
        id: kube
        env:
          VERSION: ${{ matrix.line.version }}
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "kubectl $VERSION"

      - name: Is this kubectl version's tag still free?
        if: matrix.line.newest
        # kube-<version> is immutable on Docker Hub: it names the first image
        # that shipped this kubectl and can never be moved. A release that keeps
        # the same kubectl must leave it where it is, or the push is refused
        # after the version tags are already out and nothing gets signed.
        id: kubetag
        env:
          KUBE_VERSION: ${{ steps.kube.outputs.version }}
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/kube-${KUBE_VERSION}")"
          case "$code" in
            200) echo "free=false" >> "$GITHUB_OUTPUT"; echo "kube-${KUBE_VERSION} already names an image; it stays where it is" ;;
            404) echo "free=true" >> "$GITHUB_OUTPUT"; echo "kube-${KUBE_VERSION} is free" ;;
            *) echo "::error::Docker Hub answered $code for kube-${KUBE_VERSION}; cannot tell whether the tag is free"; exit 1 ;;
          esac

      - name: Is sha-<commit> still free on Docker Hub
        if: matrix.line.newest
        id: shatag
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA::7}"
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${tag}")"
          case "$code" in
            200) echo "free=false" >> "$GITHUB_OUTPUT"; echo "${tag} already names an image; this build does not try to move it" ;;
            404) echo "free=true" >> "$GITHUB_OUTPUT"; echo "${tag} is free" ;;
            *) echo "::error::Docker Hub answered $code for ${tag}; cannot tell whether the tag is free"; exit 1 ;;
          esac

      - name: Compute build metadata
        id: meta-build
        run: |
          set -euo pipefail
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "vcs_ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          # sha-<commit> is emitted only while Docker Hub does not hold it. The tag
          # is immutable there, and any run that rebuilds a commit already
          # published (a release tag, the weekly schedule, a manual dispatch)
          # would try to move it, fail after pushing the other tags, and skip
          # signing. That is how v2.2.0 shipped unsigned.
          # Only the newest line moves latest, edge, the release tags and the
          # immutable per-commit and per-version tags; every line moves its own
          # kube-<minor>, which is not immutable on Docker Hub.
          tags: |
            type=raw,value=latest,enable=${{ matrix.line.newest && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=edge,enable=${{ matrix.line.newest && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=tag,enable=${{ matrix.line.newest }}
            type=semver,pattern={{version}},enable=${{ matrix.line.newest }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ matrix.line.newest }}
            type=semver,pattern={{major}},enable=${{ matrix.line.newest }}
            type=sha,prefix=sha-,format=short,enable=${{ matrix.line.newest && github.ref_type == 'branch' && steps.shatag.outputs.free == 'true' }}
            type=raw,value=kube-${{ steps.kube.outputs.version }},enable=${{ matrix.line.newest && startsWith(github.ref, 'refs/tags/') && steps.kubetag.outputs.free == 'true' }}
            type=raw,value=kube-${{ matrix.line.minor }}
          labels: |
            org.opencontainers.image.title=aws-kubectl
            org.opencontainers.image.description=Ubuntu 26.04 image bundling AWS CLI v2, kubectl, jq, envsubst, curl and ca-certificates for CI/CD and local tooling.
            org.opencontainers.image.vendor=heyvaldemar
            org.opencontainers.image.licenses=MIT
            io.heyvaldemar.kubectl.version=${{ steps.kube.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        timeout-minutes: 20
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KUBE_VERSION=${{ steps.kube.outputs.version }}
            VCS_REF=${{ steps.meta-build.outputs.vcs_ref }}
            BUILD_DATE=${{ steps.meta-build.outputs.build_date }}
          cache-from: type=gha,scope=kube-${{ matrix.line.minor }}
          cache-to: type=gha,mode=max,scope=kube-${{ matrix.line.minor }}
          sbom: true
          provenance: mode=max

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          # Docker Hub OCI referrers credential handoff is unreliable here; the
          # attestation remains available via GitHub Attestations storage.
          push-to-registry: false

      - name: Install cosign
        if: github.event_name != 'pull_request'
        # Install Cosign v2.6.1 explicitly: cosign-installer v4 defaults to Cosign
        # v3.x, which changes container signature storage to OCI 1.1 referring
        # artifacts. Docker Hub's OCI referrer credential handoff proved unreliable
        # in Phase 2 (see hotfix #20). Cosign v2 keeps tag-based .sig storage which
        # works reliably on Docker Hub today. Full Cosign v3 migration is deferred
        # to a separate tracked project.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.6.1"

      - name: Sign image with cosign (keyless)
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${TAGS}" ] || [ -z "${DIGEST}" ]; then
            echo "ERROR: TAGS or DIGEST is empty" >&2
            exit 1
          fi
          echo "${TAGS}" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Signing: ${tag}@${DIGEST}"
            cosign sign --yes "${tag}@${DIGEST}"
          done
          echo "All tags signed successfully"

  scan-trivy:
    name: Scan published kubectl ${{ matrix.line.minor }} with Trivy
    runs-on: ubuntu-latest
    needs: [versions, build]
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(needs.versions.outputs.lines) }}
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    # NO continue-on-error, and the difference is not cosmetic. The action's
    # exit code defaults to 0, so a finding never failed this job; the only
    # thing the flag could hide was a scan that did not finish - a deadline, a
    # registry refusing the pull. When the scan step fails the SARIF upload
    # after it is skipped, so nothing reaches the Security tab either, and the
    # run still said success. The same flag was removed from sixty templates
    # after one of them hid exactly that; this pipeline was not a template, so
    # that rollout never reached it. The image is already published by the time
    # this runs, so a red here changes what is visible, not what is shipped.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The digest kube-${{ matrix.line.minor }} names now
        id: digest
        env:
          MINOR: ${{ matrix.line.minor }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:kube-${MINOR}" --format '{{json .Manifest}}' | jq -r .digest)"
          case "$digest" in sha256:*) ;; *) echo "::error::could not resolve ${IMAGE_NAME}:kube-${MINOR}"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          # The newest line keeps the category the single image always used, so
          # its open alerts carry on; the older lines get their own.
          category: ${{ matrix.line.newest && 'trivy' || format('trivy-kube-{0}', matrix.line.minor) }}

  dockerhub-description:
    name: Sync Docker Hub description
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: "AWS CLI v2 + kubectl on Ubuntu 26.04, amd64/arm64. Signed; AWS CLI and kubectl verified at build."
          readme-filepath: ./README.md
